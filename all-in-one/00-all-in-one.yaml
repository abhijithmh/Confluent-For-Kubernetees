# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 1: Core Infrastructure (StorageClasses, OpenLDAP & KRaft Controller)
# ==============================================================================

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp2
  fsType: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp2
  fsType: ext4

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: confluent
  labels:
    app: openldap
    component: identity-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
        component: identity-provider
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /container/service/slapd/assets/config/bootstrap/ldif/custom
              cp /bootstrap-ldif/ldap-init.ldif /container/service/slapd/assets/config/bootstrap/ldif/custom/custom.ldif
              exec /container/tool/run
          env:
            - name: LDAP_ORGANISATION
              value: "Example Inc."
            - name: LDAP_DOMAIN
              value: "example.com"
            - name: LDAP_ADMIN_PASSWORD
              value: "adminpassword"
            - name: LDAP_CONFIG_PASSWORD
              value: "configpassword"
            - name: LDAP_TLS
              value: "false"
          ports:
            - containerPort: 389
              name: ldap
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: bootstrap-ldif
              mountPath: /bootstrap-ldif
      volumes:
        - name: bootstrap-ldif
          configMap:
            name: openldap-bootstrap-ldif
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: confluent
  labels:
    app: openldap
    component: identity-provider
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: 389
---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
  labels:
    app: kraftcontroller
    component: consensus
spec:
  pdb:
    enabled: false
  replicas: 1
  image:
    application: confluentinc/cp-server:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: standard
  podTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  configOverrides:
    jvm:
      - "-Xmx512m"
      - "-XX:+UseContainerSupport"
    server:
      - "confluent.balancer.enable=false"

apiVersion: v1
data:
  ldap-init.ldif: |
    dn: ou=users,dc=example,dc=com
    objectClass: organizationalUnit
    ou: users

    dn: ou=groups,dc=example,dc=com
    objectClass: organizationalUnit
    ou: groups

    dn: cn=admin,ou=users,dc=example,dc=com
    objectClass: inetOrgPerson
    cn: admin
    sn: Admin
    userPassword: adminpassword

    dn: cn=dev_user,ou=users,dc=example,dc=com
    objectClass: inetOrgPerson
    cn: dev_user
    sn: Developer
    userPassword: devpassword

    dn: cn=view_user,ou=users,dc=example,dc=com
    objectClass: inetOrgPerson
    cn: view_user
    sn: Viewer
    userPassword: viewpassword

    dn: cn=parvathi,ou=users,dc=example,dc=com
    objectClass: inetOrgPerson
    cn: parvathi
    sn: Viewer
    userPassword: parvathipassword

    dn: cn=kafka_admins,ou=groups,dc=example,dc=com
    objectClass: groupOfNames
    cn: kafka_admins
    member: cn=admin,ou=users,dc=example,dc=com

    dn: cn=kafka_developers,ou=groups,dc=example,dc=com
    objectClass: groupOfNames
    cn: kafka_developers
    member: cn=dev_user,ou=users,dc=example,dc=com
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: openldap-bootstrap-ldif
  namespace: confluent
# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 2: Kafka Broker Cluster & Kafka REST Class
# ==============================================================================

---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
  labels:
    app: kafka
    component: streaming-broker
spec:
  replicas: 2
  pdb:
    enabled: false
  image:
    application: confluentinc/cp-server:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: standard
  listeners:
    external:
      authentication:
        type: plain
        jaasConfig:
          secretRef: mds-client-creds
      externalAccess:
        type: nodePort
        nodePort:
          host: 32.198.108.214
          nodePortOffset: 30022
  metricReporter:
    enabled: true
  podTemplate:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - kafka
            topologyKey: "kubernetes.io/hostname"
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1.5Gi
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
  authorization:
    type: rbac
    superUsers:
      - User:kafka-operator
      - User:admin
      - User:ANONYMOUS
      - User:kafka
  services:
    mds:
      tokenKeyPair:
        secretRef: mds-token-pem
      provider:
        type: ldap
        ldap:
          address: "ldap://openldap.confluent.svc.cluster.local:389"
          authentication:
            type: simple
            simple:
              secretRef: ldap-bind-creds
          configurations:
            userSearchBase: "ou=users,dc=example,dc=com"
            groupSearchBase: "ou=groups,dc=example,dc=com"
            userNameAttribute: "cn"
            userObjectClass: "inetOrgPerson"
            groupMemberAttribute: "member"
            groupMemberAttributePattern: "cn=(.*),ou=users,dc=example,dc=com"
            groupNameAttribute: "cn"
            groupObjectClass: "groupOfNames"
  configOverrides:
    jvm:
      - "-Xmx768m"
      - "-XX:+UseContainerSupport"
    server:
      - "confluent.balancer.enable=false"
      - "offsets.topic.replication.factor=2"
      - "transaction.state.log.replication.factor=2"
      - "transaction.state.log.min.isr=1"
      - "default.replication.factor=2"
      - "min.insync.replicas=1"
      - "confluent.license.topic.replication.factor=2"
      - "confluent.metadata.topic.replication.factor=2"
      - "confluent.security.event.logger.exporter.kafka.topic.replicas=2"
      - "confluent.balancer.topic.replication.factor=2"
      - "confluent.link.metadata.topic.replication.factor=2"
      - "confluent.cluster.link.metadata.topic.replication.factor=2"
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: confluent
  labels:
    app: kafka-rest-class
spec:
  kafkaClusterRef:
    name: kafka
  kafkaRest:
    endpoint: http://kafka.confluent.svc.cluster.local:8090
    authentication:
      type: bearer
      bearer:
        secretRef: mds-client-creds
# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 3: Ecosystem Services (Schema Registry, Kafka Connect, Control Center)
# ==============================================================================

---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
  labels:
    app: schemaregistry
    component: schema-management
spec:
  replicas: 1
  pdb:
    enabled: false
  image:
    application: confluentinc/cp-schema-registry:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  podTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 768Mi
  configOverrides:
    jvm:
      - "-Xmx384m"
      - "-XX:+UseContainerSupport"
  authorization:
    type: rbac
    kafkaRestClassRef:
      name: default
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9073
    mds:
      endpoint: http://kafka.confluent.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-pem
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: kafka-connect
  namespace: confluent
  labels:
    app: kafka-connect
    component: data-integration
spec:
  pdb:
    enabled: false
  replicas: 1
  build:
    type: onDemand
    onDemand:
      plugins:
        locationType: confluentHub
        confluentHub:
          - name: kafka-connect-datagen
            owner: confluentinc
            version: 0.6.4
  image:
    application: confluentinc/cp-server-connect:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 1024Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    probe:
      liveness:
        initialDelaySeconds: 180
        failureThreshold: 10
      readiness:
        initialDelaySeconds: 15
        failureThreshold: 10
  configOverrides:
    server:
      - config.storage.replication.factor=2
      - offset.storage.replication.factor=2
      - status.storage.replication.factor=2
      - connector.client.config.override.policy=All
      - producer.max.request.size=52428800
      - producer.buffer.memory=67108864
      - producer.compression.type=gzip
    jvm:
      - "-Xmx512m"
      - "-XX:+UseContainerSupport"
  authorization:
    type: rbac
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9073
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
    mds:
      endpoint: http://kafka.confluent.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-pem
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
  labels:
    app: controlcenter
    component: management-ui
spec:
  replicas: 1
  pdb:
    enabled: false
  image:
    application: confluentinc/cp-enterprise-control-center:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: standard
  authorization:
    type: rbac
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9073
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
    connect:
      - name: kafka-connect
        url: http://kafka-connect.confluent.svc.cluster.local:8083
    mds:
      endpoint: http://kafka.confluent.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-pem
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 1024Mi
      limits:
        cpu: "1"
        memory: 1.5Gi
    probe:
      liveness:
        initialDelaySeconds: 60
        failureThreshold: 10
      readiness:
        initialDelaySeconds: 30
        failureThreshold: 10
  configOverrides:
    server:
      - confluent.controlcenter.internal.topics.replication=2
      - confluent.controlcenter.command.topic.replication=2
      - confluent.metrics.topic.replication=2
      - confluent.monitoring.interceptor.topic.replication=2
      - confluent.controlcenter.internal.topics.partitions=1
      - confluent.metrics.topic.max.message.bytes=8388608
    jvm:
      - "-Xmx768m"
      - "-XX:+UseContainerSupport"
---
apiVersion: v1
kind: Service
metadata:
  name: controlcenter-public
  namespace: confluent
  labels:
    app: controlcenter
    component: management-ui-public
spec:
  type: NodePort
  selector:
    app: controlcenter
    platform.confluent.io/type: controlcenter
  ports:
    - name: http-controlcenter
      protocol: TCP
      port: 9021
      targetPort: 9021
      nodePort: 30021
# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 4: Monitoring & External Access (Kafka Exporter, Port Forwarder, Cloudflare)
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
        component: metrics-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - "--kafka.server=kafka.confluent.svc.cluster.local:9071"
            - "--web.listen-address=:9308"
            - "--web.telemetry-path=/metrics"
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  type: NodePort
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
      nodePort: 30938
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-quick-tunnel
  namespace: confluent
  labels:
    app: cloudflared-quick-tunnel
    component: external-tunnels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-quick-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-quick-tunnel
        component: external-tunnels
    spec:
      containers:
        - name: cloudflared-controlcenter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://controlcenter.confluent.svc.cluster.local:9021
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-tcp
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - tcp://kafka.confluent.svc.cluster.local:9092
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-metrics
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka.confluent.svc.cluster.local:7778
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-exporter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka-exporter.confluent.svc.cluster.local:9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 5: Role-Based Access Control (RBAC RoleBindings)
# ==============================================================================

---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-system-admin
  namespace: confluent
  labels:
    app: rbac
    role: system-admin
spec:
  principal:
    type: user
    name: admin
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dev-user-developer-read
  namespace: confluent
  labels:
    app: rbac
    role: developer-read
spec:
  principal:
    type: user
    name: dev_user
  role: DeveloperRead
  resourcePatterns:
    - resourceType: Topic
      name: test-topic
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-connect-all-connectors
  namespace: confluent
  labels:
    app: rbac
    role: connect-all-connectors
spec:
  principal:
    type: user
    name: admin
  role: ResourceOwner
  resourcePatterns:
    - resourceType: Connector
      name: datagen-users-source
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
  clustersScopeByIds:
    connectClusterId: confluent.kafka-connect
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-connect-system-admin
  namespace: confluent
  labels:
    app: rbac
    role: connect-system-admin
spec:
  principal:
    type: user
    name: admin
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
  clustersScopeByIds:
    connectClusterId: confluent.kafka-connect
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-schemaregistry-system-admin
  namespace: confluent
  labels:
    app: rbac
    role: schemaregistry-system-admin
spec:
  principal:
    type: user
    name: admin
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
  clustersScopeByIds:
    schemaRegistryClusterId: id_schemaregistry_confluent


# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 6: Kubernetes Declarative Connector (Datagen Users Source)
# ==============================================================================

apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: datagen-users-source
  namespace: confluent
  labels:
    app: datagen-users-source
    component: connector
spec:
  class: "io.confluent.kafka.connect.datagen.DatagenConnector"
  taskMax: 1
  connectClusterRef:
    name: kafka-connect
  connectRest:
    authentication:
      type: bearer
      bearer:
        secretRef: mds-client-creds
  configs:
    kafka.topic: "Product"
    quickstart: "users"
    key.converter: "org.apache.kafka.connect.storage.StringConverter"
    value.converter: "org.apache.kafka.connect.json.JsonConverter"
    value.converter.schemas.enable: "false"
    max.interval: "1000"
    principal.service.name: "admin"
    principal.service.password: "adminpassword"
