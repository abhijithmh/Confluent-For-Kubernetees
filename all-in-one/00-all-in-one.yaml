# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK) - ALL-IN-ONE DEPLOYMENT MANIFEST
# Consolidated Production-Ready Deployment
# Components: OpenLDAP, KRaft, Kafka, Schema Registry, Connect, Control Center,
# Exporter, In-Cluster Router, Cloudflare Quick Tunnels, RBAC RoleBindings
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CORE INFRASTRUCTURE (OpenLDAP & KRaft Controller)
# ------------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: confluent
  labels:
    app: openldap
    component: identity-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
        component: identity-provider
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          env:
            - name: LDAP_ORGANISATION
              value: "Example Inc."
            - name: LDAP_DOMAIN
              value: "example.com"
            - name: LDAP_ADMIN_PASSWORD
              value: "adminpassword"
            - name: LDAP_CONFIG_PASSWORD
              value: "configpassword"
          ports:
            - containerPort: 389
              name: ldap
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: confluent
  labels:
    app: openldap
    component: identity-provider
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: 389
---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
  labels:
    app: kraftcontroller
    component: consensus
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: standard
  podTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  configOverrides:
    jvm:
      - "-Xmx256m"
      - "-XX:+UseContainerSupport"

# ------------------------------------------------------------------------------
# 2. KAFKA BROKER CLUSTER & REST CLASS
# ------------------------------------------------------------------------------
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
  labels:
    app: kafka
    component: streaming-broker
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: standard
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
  authorization:
    type: rbac
    superUsers:
      - User:kafka-operator
      - User:admin
      - User:ANONYMOUS
      - User:kafka
  services:
    mds:
      tokenKeyPair:
        secretRef: mds-token-pem
      provider:
        type: ldap
        ldap:
          address: "ldap://openldap.confluent.svc.cluster.local:389"
          authentication:
            type: simple
            simple:
              secretRef: ldap-bind-creds
          configurations:
            userSearchBase: "ou=users,dc=example,dc=com"
            groupSearchBase: "ou=groups,dc=example,dc=com"
            userNameAttribute: "cn"
            userObjectClass: "inetOrgPerson"
            groupMemberAttribute: "member"
            groupMemberAttributePattern: "cn=(.*),ou=users,dc=example,dc=com"
            groupNameAttribute: "cn"
            groupObjectClass: "groupOfNames"
  configOverrides:
    jvm:
      - "-Xmx384m"
      - "-XX:+UseContainerSupport"
    server:
      - "offsets.topic.replication.factor=1"
      - "transaction.state.log.replication.factor=1"
      - "transaction.state.log.min.isr=1"
      - "confluent.license.topic.replication.factor=1"
      - "confluent.metadata.topic.replication.factor=1"
      - "confluent.security.event.logger.exporter.kafka.topic.replicas=1"
      - "confluent.balancer.topic.replication.factor=1"
      - "confluent.link.metadata.topic.replication.factor=1"
      - "confluent.cluster.link.metadata.topic.replication.factor=1"
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: confluent
  labels:
    app: kafka-rest-class
spec:
  kafkaClusterRef:
    name: kafka
  kafkaRest:
    endpoint: http://kafka.confluent.svc.cluster.local:8090
    authentication:
      type: bearer
      bearer:
        secretRef: mds-client-creds

# ------------------------------------------------------------------------------
# 3. ECOSYSTEM SERVICES (Schema Registry, Kafka Connect, Control Center)
# ------------------------------------------------------------------------------
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
  labels:
    app: schemaregistry
    component: schema-management
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  podTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  configOverrides:
    jvm:
      - "-Xmx256m"
      - "-XX:+UseContainerSupport"
  authorization:
    type: rbac
    kafkaRestClassRef:
      name: default
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9073
    mds:
      endpoint: http://kafka.confluent.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-pem
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: kafka-connect
  namespace: confluent
  labels:
    app: kafka-connect
    component: data-integration
spec:
  pdb:
    enabled: false
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1024Mi
    probe:
      liveness:
        initialDelaySeconds: 180
        failureThreshold: 10
      readiness:
        initialDelaySeconds: 180
        failureThreshold: 10
  configOverrides:
    server:
      - config.storage.replication.factor=1
      - offset.storage.replication.factor=1
      - status.storage.replication.factor=1
      - connector.client.config.override.policy=All
      - producer.max.request.size=52428800
      - producer.buffer.memory=67108864
      - producer.compression.type=gzip
    jvm:
      - "-Xmx512m"
      - "-XX:+UseContainerSupport"
  authorization:
    type: rbac
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9092
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
    mds:
      endpoint: http://kafka.confluent.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-pem
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
  labels:
    app: controlcenter
    component: management-ui
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: standard
  authorization:
    type: rbac
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9073
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
    mds:
      endpoint: http://kafka.confluent.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-pem
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-creds
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    probe:
      liveness:
        initialDelaySeconds: 60
        failureThreshold: 10
      readiness:
        initialDelaySeconds: 30
        failureThreshold: 10
  configOverrides:
    server:
      - confluent.controlcenter.internal.topics.replication=1
      - confluent.controlcenter.command.topic.replication=1
      - confluent.metrics.topic.replication=1
      - confluent.monitoring.interceptor.topic.replication=1
      - confluent.controlcenter.internal.topics.partitions=1
      - confluent.metrics.topic.max.message.bytes=8388608
    jvm:
      - "-Xmx256m"
      - "-XX:+UseContainerSupport"
---
apiVersion: v1
kind: Service
metadata:
  name: controlcenter-public
  namespace: confluent
  labels:
    app: controlcenter
    component: management-ui-public
spec:
  type: NodePort
  selector:
    app: controlcenter
    platform.confluent.io/type: controlcenter
  ports:
    - name: http-controlcenter
      protocol: TCP
      port: 9021
      targetPort: 9021
      nodePort: 30021

# ------------------------------------------------------------------------------
# 4. MONITORING & EXTERNAL ACCESS
# ------------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
        component: metrics-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - "--kafka.server=kafka.confluent.svc.cluster.local:9092"
            - "--web.listen-address=:9308"
            - "--web.telemetry-path=/metrics"
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  type: NodePort
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
      nodePort: 30938
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-port-forwarder
  namespace: confluent
  labels:
    app: k8s-port-forwarder
    component: in-cluster-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-port-forwarder
  template:
    metadata:
      labels:
        app: k8s-port-forwarder
        component: in-cluster-router
    spec:
      hostNetwork: true
      serviceAccountName: default
      containers:
        - name: port-forwarder
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Starting Kubernetes in-cluster permanent port-forwarder..."
              
              run_pf() {
                local svc="$1"
                local ports="$2"
                while true; do
                  echo "Launching port-forward for ${svc} (${ports})..."
                  kubectl port-forward --address 0.0.0.0 -n confluent "service/${svc}" ${ports} || true
                  sleep 3
                done
              }
              
              run_pf "controlcenter-public" "30021:9021" &
              run_pf "kafka" "9092:9092" &
              run_pf "kafka-exporter" "9308:9308" &
              
              wait
          resources: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: port-forwarder-admin-binding
  namespace: confluent
  labels:
    app: k8s-port-forwarder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: confluent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-quick-tunnel
  namespace: confluent
  labels:
    app: cloudflared-quick-tunnel
    component: external-tunnels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-quick-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-quick-tunnel
        component: external-tunnels
    spec:
      containers:
        - name: cloudflared-controlcenter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://controlcenter.confluent.svc.cluster.local:9021
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-tcp
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - tcp://kafka.confluent.svc.cluster.local:9092
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-metrics
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka.confluent.svc.cluster.local:7778
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-exporter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka-exporter.confluent.svc.cluster.local:9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

# ------------------------------------------------------------------------------
# 5. ROLE-BASED ACCESS CONTROL (ConfluentRoleBindings)
# ------------------------------------------------------------------------------
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-system-admin
  namespace: confluent
  labels:
    app: rbac
    role: system-admin
spec:
  principal:
    type: user
    name: admin
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
  clustersScopeByIds:
    kafkaClusterId: confluent
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dev-user-developer-read
  namespace: confluent
  labels:
    app: rbac
    role: developer-read
spec:
  principal:
    type: user
    name: dev_user
  role: DeveloperRead
  resourcePatterns:
    - resourceType: Topic
      name: test-topic
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
  clustersScopeByIds:
    kafkaClusterId: confluent

