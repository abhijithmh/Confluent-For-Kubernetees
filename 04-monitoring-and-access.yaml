# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 4: Monitoring & External Access (Kafka Exporter, Port Forwarder, Cloudflare)
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
        component: metrics-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - "--kafka.server=kafka.confluent.svc.cluster.local:9092"
            - "--web.listen-address=:9308"
            - "--web.telemetry-path=/metrics"
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  type: NodePort
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
      nodePort: 30938
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-port-forwarder
  namespace: confluent
  labels:
    app: k8s-port-forwarder
    component: in-cluster-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-port-forwarder
  template:
    metadata:
      labels:
        app: k8s-port-forwarder
        component: in-cluster-router
    spec:
      hostNetwork: true
      serviceAccountName: default
      containers:
        - name: port-forwarder
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Starting Kubernetes in-cluster permanent port-forwarder..."
              
              run_pf() {
                local svc="$1"
                local ports="$2"
                while true; do
                  echo "Launching port-forward for ${svc} (${ports})..."
                  kubectl port-forward --address 0.0.0.0 -n confluent "service/${svc}" ${ports} || true
                  sleep 3
                done
              }
              
              run_pf "controlcenter-public" "30021:9021" &
              run_pf "kafka" "9092:9092" &
              run_pf "kafka-exporter" "9308:9308" &
              
              wait
          resources: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: port-forwarder-admin-binding
  namespace: confluent
  labels:
    app: k8s-port-forwarder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: confluent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-quick-tunnel
  namespace: confluent
  labels:
    app: cloudflared-quick-tunnel
    component: external-tunnels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-quick-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-quick-tunnel
        component: external-tunnels
    spec:
      containers:
        - name: cloudflared-controlcenter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://controlcenter.confluent.svc.cluster.local:9021
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-tcp
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - tcp://kafka.confluent.svc.cluster.local:9092
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-metrics
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka.confluent.svc.cluster.local:7778
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-exporter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka-exporter.confluent.svc.cluster.local:9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
