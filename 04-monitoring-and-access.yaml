# ==============================================================================
# CONFLUENT PLATFORM ON KUBERNETES (CFK)
# Part 4: Monitoring & External Access (Kafka Exporter, Port Forwarder, Cloudflare)
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
        component: metrics-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - "--kafka.server=kafka.confluent.svc.cluster.local:9071"
            - "--web.listen-address=:9308"
            - "--web.telemetry-path=/metrics"
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: confluent
  labels:
    app: kafka-exporter
    component: metrics-exporter
spec:
  type: NodePort
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
      nodePort: 30938
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-quick-tunnel
  namespace: confluent
  labels:
    app: cloudflared-quick-tunnel
    component: external-tunnels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-quick-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-quick-tunnel
        component: external-tunnels
    spec:
      containers:
        - name: cloudflared-controlcenter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://controlcenter.confluent.svc.cluster.local:9021
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-tcp
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - tcp://kafka.confluent.svc.cluster.local:9092
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-metrics
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka.confluent.svc.cluster.local:7778
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-kafka-exporter
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --url
            - http://kafka-exporter.confluent.svc.cluster.local:9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
