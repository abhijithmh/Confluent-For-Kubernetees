apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-producer-config
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-producer
    app.kubernetes.io/part-of: confluent-client
data:
  KAFKA_BOOTSTRAP_SERVERS: "32.198.108.214:30022"
  KAFKA_TOPIC: "Product"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_ACKS: "all"
  PRODUCE_INTERVAL_SECONDS: "1.0"
  PRODUCE_BATCH_SIZE: "1"
  HEALTH_PORT: "8081"
  LOG_LEVEL: "INFO"
